name: Build SUPER SEDDIK & JOUD Android APK

on:
  workflow_dispatch:
  push:
    branches: [super-joud]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'admob.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V200 source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate game JavaScript before Android build
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active = False; self.parts = []; self.blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.active = True; self.parts = []
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.active:
                      self.blocks.append(''.join(self.parts)); self.active = False
          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          inline = [s for s in parser.blocks if s.strip()]
          if not inline:
              raise SystemExit('No inline game JavaScript found')
          Path('/tmp/game-inline.js').write_text('\n'.join(inline), encoding='utf-8')
          print(f'Extracted {len(inline)} inline JavaScript block(s)')
          PY
          node --check /tmp/game-inline.js
          node --check sw.js
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare local game assets
        run: |
          mkdir -p www/icons
          cp index.html manifest.webmanifest sw.js www/
          cp icons/*.png www/icons/
      - name: Inject AdMob identifiers into the game
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('admob.json').read_text(encoding='utf-8'))
          ads = {'test': bool(cfg.get('test', True)), 'rewarded': cfg['rewarded'], 'interstitial': cfg['interstitial']}
          page = Path('www/index.html')
          html = page.read_text(encoding='utf-8')
          tag = '<script>window.SJ_ADS=' + json.dumps(ads) + ';</script>'
          if '</head>' not in html:
              raise SystemExit('index.html has no </head>')
          page.write_text(html.replace('</head>', tag + '</head>', 1), encoding='utf-8')
          print('AdMob config injected, test mode =', ads['test'])
          PY
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync game into Android app
        run: npx cap sync android
      - name: Add native Android team text-to-speech bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base = Path("android/app/src/main/java/com/seddik/superjoud")
          base.mkdir(parents=True, exist_ok=True)
          plugin = r"""package com.seddik.superjoud;

          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import java.util.ArrayDeque;
          import java.util.Locale;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "TeamTTS")
          public class TeamTTSPlugin extends Plugin implements TextToSpeech.OnInitListener {
              private TextToSpeech engine;
              private boolean ready = false;
              private boolean failed = false;
              private boolean triedGoogle = false;
              private final ArrayDeque<SpeechItem> queue = new ArrayDeque<>();
              private static class SpeechItem {
                  final String text, language;
                  final float rate;
                  SpeechItem(String t, String l, float r) { text=t; language=l; rate=r; }
              }

              @Override public void load() {
                  engine = new TextToSpeech(getContext().getApplicationContext(), this);
                  if (engine == null) failed = true;
              }

              @Override public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS && !triedGoogle) {
                      triedGoogle = true;
                      try {
                          if (engine != null) engine.shutdown();
                          engine = new TextToSpeech(getContext().getApplicationContext(), this, "com.google.android.tts");
                          return;
                      } catch (Exception e) { /* on garde l'échec ci-dessous */ }
                  }
                  ready = status == TextToSpeech.SUCCESS;
                  failed = !ready;
                  if (ready && engine != null) {
                      try {
                          engine.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                      } catch (Exception e) { /* attributs audio facultatifs */ }
                  }
                  notifyTtsStatus(ready ? "ready" : "init_error", ready ? "Moteur vocal Android prêt" : "Android TextToSpeech initialization failed");
                  if (ready) {
                      while (!queue.isEmpty()) {
                          SpeechItem item = queue.poll();
                          speakNow(item.text, item.language, item.rate, null);
                      }
                  }
              }

              private void notifyTtsStatus(String state, String message) {
                  JSObject data = new JSObject();
                  data.put("state", state);
                  data.put("message", message);
                  notifyListeners("status", data);
              }

              @PluginMethod public void status(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put("ready", ready);
                  result.put("failed", failed);
                  result.put("queued", queue.size());
                  call.resolve(result);
              }

              @PluginMethod public void speak(PluginCall call) {
                  String text = call.getString("text", "");
                  String language = call.getString("language", "fr-FR");
                  double rate = call.getDouble("rate", 0.94);
                  if (text == null || text.trim().isEmpty()) {
                      call.reject("Aucune consigne vocale à lire");
                      return;
                  }
                  if (failed) {
                      call.reject("Moteur vocal Android indisponible. Vérifie le service de synthèse vocale dans les paramètres Android.");
                      return;
                  }
                  SpeechItem item = new SpeechItem(text, language, (float) rate);
                  if (!ready || engine == null) {
                      if (queue.size() >= 8) queue.poll();
                      queue.add(item);
                      JSObject result = new JSObject();
                      result.put("queued", true);
                      result.put("queueSize", queue.size());
                      call.resolve(result);
                      return;
                  }
                  speakNow(item.text, item.language, item.rate, call);
              }

              private void speakNow(String text, String language, float rate, PluginCall call) {
                  if (engine == null || !ready) {
                      if (call != null) call.reject("Moteur vocal Android non prêt");
                      return;
                  }
                  String tag = language == null ? "fr-FR" : language;
                  Locale locale = pick(tag);
                  if (locale == null) {
                      notifyTtsStatus("language_error", "Voix " + tag + " absente. Installe les données vocales dans Android.");
                      if (call != null) call.reject("Voix " + tag + " non installée sur Android");
                      return;
                  }
                  engine.setLanguage(locale);
                  engine.setSpeechRate(Math.max(0.75f, Math.min(1.15f, rate)));
                  String utteranceId = "sj-team-" + System.nanoTime();
                  engine.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String id) { notifyTtsStatus("speaking", "Lecture de la consigne de l’équipe"); }
                      @Override public void onDone(String id) { notifyTtsStatus("done", "Consigne terminée"); }
                      @Override public void onError(String id) { notifyTtsStatus("speech_error", "Le moteur vocal Android a interrompu la lecture"); }
                  });
                  Bundle params = new Bundle();
                  params.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, 1.0f);
                  int spoken = engine.speak(text, TextToSpeech.QUEUE_FLUSH, params, utteranceId);
                  if (spoken == TextToSpeech.ERROR) {
                      notifyTtsStatus("speech_error", "Android a refusé la consigne vocale");
                      if (call != null) call.reject("Android a refusé la lecture vocale");
                  } else if (call != null) {
                      JSObject resultData = new JSObject();
                      resultData.put("queued", false);
                      call.resolve(resultData);
                  }
              }

              private Locale pick(String tag) {
                  if (engine == null || tag == null) return null;
                  String base = tag.length() >= 2 ? tag.substring(0, 2) : tag;
                  for (String candidate : new String[] { tag, base }) {
                      try {
                          Locale locale = Locale.forLanguageTag(candidate);
                          if (engine.isLanguageAvailable(locale) >= TextToSpeech.LANG_AVAILABLE) return locale;
                      } catch (Exception e) { /* essai suivant */ }
                  }
                  return null;
              }

              @PluginMethod public void voices(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put("ready", ready);
                  result.put("failed", failed);
                  if (ready && engine != null) {
                      for (String base : new String[] { "fr", "en", "ar" }) result.put(base, pick(base) != null);
                  }
                  call.resolve(result);
              }

              @PluginMethod public void installVoices(PluginCall call) {
                  try {
                      Intent intent = new Intent(TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Réglages vocaux Android inaccessibles");
                  }
              }

              @PluginMethod public void stop(PluginCall call) {
                  if (engine != null) engine.stop();
                  queue.clear();
                  call.resolve();
              }

              @Override protected void handleOnDestroy() {
                  if (engine != null) { engine.stop(); engine.shutdown(); engine = null; }
                  queue.clear();
                  super.handleOnDestroy();
              }
          }
          """
          (base / "TeamTTSPlugin.java").write_text(plugin, encoding="utf-8")
          main = base / "MainActivity.java"
          source = main.read_text(encoding="utf-8")
          if "TeamTTSPlugin.class" not in source:
              source = source.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;" + chr(10) + "import android.os.Bundle;")
              marker = "public class MainActivity extends BridgeActivity {"
              if marker not in source:
                  raise SystemExit("Unexpected generated MainActivity: " + source)
              method = chr(10) + "    @Override public void onCreate(Bundle savedInstanceState) {" + chr(10) + "        registerPlugin(TeamTTSPlugin.class);" + chr(10) + "        super.onCreate(savedInstanceState);" + chr(10) + "    }"
              source = source.replace(marker, marker + method, 1)
              main.write_text(source, encoding="utf-8")
          print("Native TeamTTS bridge registered")
          PY
      - name: Apply premium supercar Android launcher icon
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open("icons/launcher-car.png").convert("RGBA")
          res = Path("android/app/src/main/res")
          densities = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, px in densities.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = src.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")
              fg_size = round(px * 2.25)
              canvas = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
              artwork = src.resize((round(fg_size * 0.68), round(fg_size * 0.68)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(artwork, ((fg_size - artwork.width) // 2, (fg_size - artwork.height) // 2))
              canvas.save(folder / "ic_launcher_foreground.png")
          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/black" />
            <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>'''
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)
          PY
      - name: Declare AdMob application id
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          app_id = json.loads(Path('admob.json').read_text(encoding='utf-8'))['appId']
          path = Path('android/app/src/main/AndroidManifest.xml')
          source = path.read_text(encoding='utf-8')
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="' + app_id + '" />\n'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in source:
              if '</application>' not in source:
                  raise SystemExit('Unexpected AndroidManifest: no </application>')
              source = source.replace('</application>', meta + '    </application>', 1)
              path.write_text(source, encoding='utf-8')
          print('AdMob application id declared:', app_id)
          PY
      - name: Lock game orientation to landscape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text(encoding="utf-8")
          if "android:screenOrientation" not in source:
              source, n = re.subn(r'(<activity\b)', r'\1 android:screenOrientation="sensorLandscape"', source, count=1)
              if n != 1:
                  raise SystemExit("Unexpected AndroidManifest: no <activity>")
              path.write_text(source, encoding="utf-8")
          print("Landscape orientation locked")
          PY
      - name: Declare Android Text-to-Speech service visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text(encoding="utf-8")
          query = """    <queries>
              <intent>
                  <action android:name="android.intent.action.TTS_SERVICE" />
              </intent>
              <intent>
                  <action android:name="android.speech.tts.engine.INSTALL_TTS_DATA" />
              </intent>
          </queries>
          """
          if "android.intent.action.TTS_SERVICE" not in source:
              source = source.replace("</manifest>", query + "</manifest>")
          if "android.permission.RECORD_AUDIO" not in source:
              perms = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
              source = source.replace("</manifest>", perms + "</manifest>")
              path.write_text(source, encoding="utf-8")
          path.write_text(source, encoding="utf-8")
          print("Android TTS service visibility and microphone permission declared")
          PY
      - name: Set Android version (V200)
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 209/; s/versionName "[^"]*"/versionName "2.0.9"/' android/app/build.gradle
          grep -n 'version' android/app/build.gradle
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-seddik-joud-v200-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to the apk branch and as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/apkout"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apkout/super-seddik-joud.apk"
          (cd android && ./gradlew bundleRelease assembleRelease) || echo "release build failed"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/apkout/release-unsigned.aab" || true
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/apkout/release-unsigned.apk" || true
          cp "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)lib/apksigner.jar" "$RUNNER_TEMP/apkout/apksigner.jar" || true
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/apkout/AndroidManifest.xml" || true
          cd "$RUNNER_TEMP/apkout"
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "APK build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
          gh release delete apk-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create apk-latest super-seddik-joud.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SUPER SEDDIK & JOUD — APK Android (test)" --notes "APK de test (debug). Désinstaller l'ancienne version avant d'installer."
      - name: Build signed release (AAB for Google Play + APK)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: signed release skipped (debug APK only)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.jks"
          mkdir -p ../release
          cp app/build/outputs/bundle/release/app-release.aab ../release/super-seddik-joud-v200.aab
          cp app/build/outputs/apk/release/app-release.apk ../release/super-seddik-joud-v200.apk
      - name: Publish signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-seddik-joud-v200-google-play-release
          path: release/
          if-no-files-found: ignore
          retention-days: 30
