name: Application Android

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Compiler
        id: build
        continue-on-error: true
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash android-app/build.sh 2>&1 | tee build.log

      - name: Publier le résultat dans la branche android-builds
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp android-app/dist/* out/ 2>/dev/null || true
          echo "statut=${{ steps.build.outcome }} compilation=${{ github.run_number }} commit=${{ github.sha }}" > out/STATUS.txt
          cd out
          git init -q
          git checkout -q -b android-builds
          git add -A
          git -c user.name="build-bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "Compilation ${{ github.run_number }} : ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-builds
