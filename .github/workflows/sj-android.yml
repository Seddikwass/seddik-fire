name: SUPER SEDDIK@JOUD Android

on:
  push:
    branches: [sj-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compiler
        id: build
        if: always()
        continue-on-error: true
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          {
            echo "== étapes : checkout=${{ steps.checkout.outcome }} node=${{ steps.node.outcome }}"
            # Java 21 et SDK Android préinstallés sur les machines GitHub
            export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
            export PATH="$JAVA_HOME/bin:$PATH"
            export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            echo "JAVA_HOME=$JAVA_HOME ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1 | tail -20
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3 || true
            bash android-app/build.sh
          } 2>&1 | tee build.log

      - name: Publier le résultat dans la branche sj-android-builds
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp android-app/dist/* out/ 2>/dev/null || true
          echo "statut=${{ steps.build.outcome }} checkout=${{ steps.checkout.outcome }} node=${{ steps.node.outcome }} compilation=${{ github.run_number }} commit=${{ github.sha }}" > out/STATUS.txt
          cd out
          git init -q
          git checkout -q -b sj-android-builds
          git add -A
          git -c user.name="build-bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "Compilation ${{ github.run_number }} : ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sj-android-builds
