<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<link rel="manifest" href="manifest.json">
<title>SEDDIK EN FORCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Rubik:ital,wght@0,400;0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--red:#d3122f;--red2:#8e0b1f;--gold:#ffcc33;--green:#5fd068;--ink:#0b0b0e;--glass:rgba(10,10,14,.72);--line:rgba(255,255,255,.12);
--fd:'Bebas Neue','Anton',Impact,'Arial Narrow',sans-serif;--ft:'Rubik','Segoe UI',Roboto,Arial,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:var(--ft);color:#fff;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.fd{font-family:var(--fd);letter-spacing:.04em}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:5px;background:linear-gradient(#f3f3f3,#cfcfcf);color:#111;font:800 13px var(--ft);box-shadow:0 2px 0 #777,0 3px 6px rgba(0,0,0,.4);margin:0 2px}

/* ===== HUD ===== */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.9)}
#tr{position:absolute;top:calc(18px + var(--sat));right:calc(22px + var(--sar));text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#clockRow{display:flex;align-items:center;gap:8px;font:700 15px var(--ft);opacity:.92}
#wIcon{width:18px;height:18px}
#money{font:400 46px var(--fd);color:#9df3a6;line-height:.95;letter-spacing:.02em;-webkit-text-stroke:1.2px #062a0c;text-shadow:0 2px 0 #062a0c,0 4px 10px rgba(0,0,0,.6)}
#moneyFx{font:400 26px var(--fd);height:26px;opacity:0;letter-spacing:.03em}
#moneyFx.pop{animation:mfx 2.6s ease-out}
@keyframes mfx{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#stars{display:flex;gap:3px;margin-top:2px}
#stars svg{width:30px;height:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
#stars .off path{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.45)}
#stars .on path{fill:#fff;stroke:#000}
#stars .blink{opacity:.25}
#mmBox{position:absolute;left:calc(22px + var(--sal));bottom:calc(22px + var(--sab));width:270px}
#mmFrame{width:270px;height:175px;border-radius:10px;overflow:hidden;border:3px solid rgba(0,0,0,.85);box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.12);background:#2c6f96;position:relative}
#minimap{width:100%;height:100%;display:block}
#mmN{position:absolute;width:20px;height:20px;border-radius:50%;background:#111;border:2px solid #fff;font:800 10px var(--ft);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
#bars{display:flex;gap:4px;margin-top:5px}
.bar{flex:1;height:8px;background:rgba(0,0,0,.65);border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bar>div{height:100%;width:100%;transform-origin:left center;transition:transform .25s}
#hp{background:linear-gradient(90deg,#3fa34d,#6fdc6f)} #carHp{background:linear-gradient(90deg,#d97a1a,#ffc23d)}
#district{position:absolute;right:calc(26px + var(--sar));bottom:calc(214px + var(--sab));text-align:right;font:italic 800 30px var(--ft);letter-spacing:-.01em;opacity:0;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#district small{display:block;font:500 13px var(--ft);font-style:normal;opacity:.75;letter-spacing:.15em;text-transform:uppercase}
#district.pop{animation:dpop 4.2s ease-out}
@keyframes dpop{0%{opacity:0;transform:translateX(18px)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
#speedo{position:absolute;right:calc(18px + var(--sar));bottom:calc(14px + var(--sab));width:200px;height:200px}
#gauge{width:200px;height:200px}
#radio{position:absolute;right:calc(230px + var(--sar));bottom:calc(30px + var(--sab));font:700 13px var(--ft);color:var(--gold);display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:20px}
#radio i{width:6px;height:12px;background:var(--gold);display:inline-block;animation:eq .5s infinite alternate}
#radio i:nth-child(2){animation-delay:.15s}#radio i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
#help{position:absolute;left:calc(22px + var(--sal));top:calc(22px + var(--sat));max-width:340px;background:var(--glass);padding:12px 16px;border-radius:6px;font:500 15px/1.45 var(--ft);border-left:3px solid var(--gold);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:slin .25s ease-out}
@keyframes slin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
#notif{position:absolute;left:calc(22px + var(--sal));top:calc(22px + var(--sat));width:340px;background:var(--glass);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;opacity:0;transform:translateY(-12px);transition:all .35s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
#notif.show{opacity:1;transform:none}
#help:not(.hidden)~#notif{top:calc(110px + var(--sat))}
#nIco{width:40px;height:40px;border-radius:9px;background:var(--red);display:flex;align-items:center;justify-content:center;flex:none;font:400 22px var(--fd)}
#nTit{font:800 12px var(--ft);letter-spacing:.12em;text-transform:uppercase;opacity:.65}
#nTxt{font:500 15px/1.3 var(--ft)}
#obj{position:absolute;left:50%;bottom:calc(64px + var(--sab));transform:translateX(-50%);font:600 19px var(--ft);text-align:center;max-width:70%;text-shadow:0 2px 3px #000,0 0 12px rgba(0,0,0,.6)}
#obj b{color:var(--gold)}
#mTimer{position:absolute;top:calc(20px + var(--sat));left:50%;transform:translateX(-50%);background:var(--glass);padding:4px 18px;border-radius:30px;font:400 34px var(--fd);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
#mTimer small{font:700 11px var(--ft);letter-spacing:.14em;opacity:.7}
#banner{position:absolute;top:30%;left:0;right:0;text-align:center;pointer-events:none}
#banner .t{font:400 clamp(48px,8vw,96px) var(--fd);letter-spacing:.05em;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.6),0 0 30px rgba(0,0,0,.6)}
#banner .s{font:600 18px var(--ft);margin-top:10px;opacity:.95}
#banner .ln{height:2px;width:min(520px,70vw);margin:12px auto;background:linear-gradient(90deg,transparent,#fff,transparent);animation:ln .8s ease-out}
@keyframes ln{from{width:0}}
#banner.show{animation:bin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes bin{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
#banner .rw{font:400 44px var(--fd);color:#9df3a6;margin-top:6px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:4}

#armor{background:linear-gradient(90deg,#2a6fc9,#5aa8ff)}
#wepBox{display:flex;align-items:center;gap:10px;margin-top:8px;background:rgba(0,0,0,.45);padding:6px 12px 6px 8px;border-radius:6px;border-right:3px solid var(--gold)}
#wepIco svg{width:44px;height:30px;fill:#fff;stroke:#000;stroke-width:.6;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
#wepIco svg path{stroke-linejoin:round}
#wepName{font:800 11px var(--ft);letter-spacing:.12em;opacity:.8;text-align:right}
#wepAmmo{font:400 24px var(--fd);text-align:right;letter-spacing:.04em;min-height:24px}#wepAmmo b{color:var(--gold);font-weight:400}#wepAmmo i{font:700 12px var(--ft);color:#ff8a8a;font-style:normal;letter-spacing:.1em}
#xhair{--sp:10px;position:absolute;left:50%;top:50%;width:0;height:0}
#xhair i{position:absolute;background:#fff;box-shadow:0 0 2px #000,0 0 1px #000}
#xhair i{transition:transform .08s}#xhair i:nth-child(1){left:-1px;top:calc(-1 * var(--sp) - 8px);width:2px;height:8px}#xhair i:nth-child(2){left:-1px;top:var(--sp);width:2px;height:8px}#xhair i:nth-child(3){top:-1px;left:calc(-1 * var(--sp) - 8px);width:8px;height:2px}#xhair i:nth-child(4){top:-1px;left:var(--sp);width:8px;height:2px}
#xhair:after{content:'';position:absolute;left:-1.5px;top:-1.5px;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 2px #000}
#xhair.hit i{background:#ff2a44}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(180,0,20,.55) 100%)}
#shop{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#shopBox{width:min(640px,94vw);max-height:90vh;overflow:auto;background:rgba(10,10,12,.94);border-top:4px solid var(--gold);padding:20px 22px;border-radius:0 0 8px 8px}
#shopHead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:8px}#shopHead small{opacity:.6}
#shopMoney{font:400 36px var(--fd);color:#9df3a6}
.shopItem{pointer-events:auto;display:flex;width:100%;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:#fff;padding:10px 12px;margin:5px 0;border-radius:5px;cursor:pointer;text-align:left;font-family:var(--ft)}
.shopItem:hover:not([disabled]){background:rgba(255,204,51,.15);border-color:var(--gold)}.shopItem[disabled]{opacity:.4;cursor:default}
.shopItem .si{width:52px;display:flex;justify-content:center;font-size:24px;color:#5aa8ff}.shopItem .si svg{width:48px;height:32px;fill:#fff}
.shopItem .sn{flex:1}.shopItem .sn b{display:block;font-size:16px}.shopItem .sn small{opacity:.65;font-size:13px}.shopItem .sp{font:400 26px var(--fd);color:var(--gold)}
#speedlines{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.0) 0deg 3deg,rgba(255,255,255,.22) 3.3deg 3.6deg);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 38%,#000 75%);mask:radial-gradient(circle at 50% 50%,transparent 38%,#000 75%);animation:sl .25s steps(2) infinite}
@keyframes sl{to{transform:rotate(2deg)}}
#perf{position:fixed;left:50%;top:calc(4px + var(--sat));transform:translateX(-50%);z-index:9;font:700 11px var(--ft);background:rgba(0,0,0,.55);padding:3px 8px;border-radius:4px;pointer-events:none}
#wheel{position:fixed;inset:0;z-index:8;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.25),rgba(0,0,0,.7) 60%)}
#wheel .wc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:rgba(10,10,14,.8);border:2px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#wheel .wc b{font:400 22px var(--fd);letter-spacing:.04em;padding:0 10px}#wheel .wc small{font:600 11px var(--ft);opacity:.6;letter-spacing:.14em}
.ws{pointer-events:auto;position:absolute;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:rgba(15,15,20,.82);border:2px solid rgba(255,255,255,.25);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:all .12s}
.ws svg{width:52px;height:34px;fill:#fff}.ws span{font:400 18px var(--fd)}
.ws.on{background:var(--red);border-color:#fff;transform:translate(-50%,-50%) scale(1.12)}.ws.no{opacity:.3}
#result{position:fixed;inset:0;z-index:14;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.rbox{width:min(560px,92vw);background:rgba(10,10,14,.94);padding:24px 26px;border-radius:0 0 10px 10px;animation:bin .45s cubic-bezier(.2,1.4,.4,1)}
.rbox.ok{border-top:5px solid var(--gold)}.rbox.ko{border-top:5px solid var(--danger)}
.rt{font:400 50px var(--fd);line-height:1;letter-spacing:.05em}.rbox.ok .rt{color:var(--gold)}.rbox.ko .rt{color:#ff5a6a}
.rn{font:800 13px var(--ft);letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-top:4px}.rbox p{margin:12px 0;font-size:15px;line-height:1.45;opacity:.9}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.rs div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;padding:10px}.rs small{display:block;font:700 10px var(--ft);letter-spacing:.14em;opacity:.6;text-transform:uppercase}.rs b{font:400 26px var(--fd);color:#9df3a6;font-weight:400}
.rb{display:flex;justify-content:flex-end;gap:8px}
#rotate{display:none;position:fixed;inset:0;z-index:40;background:#07070a;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px}
#rotate svg{width:90px;height:90px;stroke:#fff;fill:none;stroke-width:1.6;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate b{font:400 34px var(--fd);letter-spacing:.05em}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
/* ===== MENU PRINCIPAL ===== */
#menu{position:fixed;inset:0;z-index:10;display:flex}
#menu:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,8,.92) 0%,rgba(5,5,8,.72) 34%,rgba(5,5,8,.05) 70%),linear-gradient(0deg,rgba(0,0,0,.6),transparent 30%)}
.lb{position:absolute;left:0;right:0;height:7vh;background:#000;z-index:2}.lb.t{top:0}.lb.b{bottom:0}
#mLeft{position:relative;z-index:3;width:min(470px,92vw);padding:calc(9vh + var(--sat)) 0 9vh calc(5vw + var(--sal));display:flex;flex-direction:column}
.logo{line-height:.82;filter:drop-shadow(0 10px 24px rgba(0,0,0,.7));transform:rotate(-4deg);transform-origin:left;margin-bottom:5vh}
.logo .l1{font:400 clamp(64px,9vw,118px) var(--fd);color:#fff;letter-spacing:.01em;-webkit-text-stroke:2px #000;text-shadow:5px 5px 0 var(--red),10px 10px 0 rgba(0,0,0,.5)}
.logo .l2{display:inline-block;font:400 clamp(30px,4.2vw,54px) var(--fd);background:var(--red);color:#fff;padding:2px 18px 0;margin-left:8px;border:3px solid #000;box-shadow:6px 6px 0 rgba(0,0,0,.6);letter-spacing:.08em}
.logo .l3{font:800 12px var(--ft);letter-spacing:.5em;margin:12px 0 0 6px;color:var(--gold);transform:rotate(4deg);transform-origin:left}
#mItems{display:flex;flex-direction:column;gap:3px}
.mi{pointer-events:auto;cursor:pointer;font:400 30px var(--fd);letter-spacing:.06em;padding:8px 18px 4px;color:rgba(255,255,255,.82);position:relative;transition:all .15s;border-left:4px solid transparent;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left}
.mi:hover,.mi.sel{color:#fff;background:linear-gradient(90deg,rgba(211,18,47,.95),rgba(211,18,47,.25) 80%,transparent);border-left-color:#fff;padding-left:26px}
.mi.main{font-size:42px}
#mFoot{margin-top:auto;font:500 13px var(--ft);opacity:.7;max-width:400px;line-height:1.5}
#mFoot b{color:var(--gold)}
#mPanel{position:relative;z-index:3;margin:calc(11vh + var(--sat)) 5vw 11vh auto;width:min(560px,48vw);background:rgba(8,8,12,.82);border-top:4px solid var(--red);padding:22px 26px;overflow:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:slin .25s ease-out;border-radius:0 0 8px 8px}
#mPanel h2{font:400 40px var(--fd);letter-spacing:.05em;margin-bottom:12px}
.card{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.card .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 24px var(--fd);flex:none;color:#000}
.card h4{font:700 16px var(--ft)}.card p{font:400 14px/1.45 var(--ft);opacity:.8}.card em{font:700 12px var(--ft);color:var(--gold);font-style:normal}
.kgrid{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:center;font:500 15px var(--ft)}
.set{margin:14px 0}.set label{display:block;font:700 12px var(--ft);letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
.seg{display:flex;gap:4px}.seg button{pointer-events:auto;flex:1;font:400 22px var(--fd);letter-spacing:.05em;padding:8px 0 5px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff;cursor:pointer;border-radius:3px}
.seg button.on{background:var(--red);border-color:var(--red)}
input[type=range]{width:100%;accent-color:var(--red);pointer-events:auto}
#loadWrap{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 30% 40%,#2a0a10,#050507 70%);display:flex;flex-direction:column;align-items:center;justify-content:center}
#loadWrap .logo{transform:rotate(-4deg);margin-bottom:6vh}
#lbar{width:min(420px,70vw);height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#lfill{height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff6a7f);transition:width .3s}
#lstep{font:600 13px var(--ft);letter-spacing:.16em;text-transform:uppercase;margin-top:14px;opacity:.7}
#ltip{position:absolute;bottom:calc(6vh + var(--sab));left:50%;transform:translateX(-50%);width:min(620px,86vw);text-align:center;font:500 15px/1.5 var(--ft);opacity:.8}
#ltip b{color:var(--gold)}

/* ===== PAUSE ===== */
#pause{position:fixed;inset:0;z-index:15;background:rgba(4,4,8,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;padding:calc(26px + var(--sat)) calc(4vw + var(--sar)) calc(20px + var(--sab)) calc(4vw + var(--sal))}
#pHead{display:flex;align-items:flex-end;gap:24px;border-bottom:2px solid var(--line);padding-bottom:10px}
#pHead .fd{font-size:40px;line-height:.9;white-space:nowrap}
#pTabs{display:flex;gap:4px;flex-wrap:wrap}
.pt{pointer-events:auto;font:400 22px var(--fd);letter-spacing:.06em;padding:8px 18px 4px;background:rgba(255,255,255,.06);border:0;color:#ddd;cursor:pointer;border-radius:3px 3px 0 0}
.pt.on{background:var(--red);color:#fff}
#pStat{margin-left:auto;text-align:right;font:500 13px var(--ft);opacity:.8;white-space:nowrap}
#pStat b{font:400 30px var(--fd);color:#9df3a6;display:block;opacity:1}
#pBody{flex:1;overflow:auto;padding:18px 0;position:relative}
#pBody canvas{width:100%;height:100%;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;padding:14px}
.stat small{font:700 11px var(--ft);letter-spacing:.14em;opacity:.6;text-transform:uppercase}.stat div{font:400 34px var(--fd);margin-top:4px}
#pFoot{display:flex;gap:10px;justify-content:flex-end;border-top:2px solid var(--line);padding-top:12px}
.btn{pointer-events:auto;cursor:pointer;font:400 22px var(--fd);letter-spacing:.06em;background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line);padding:8px 22px 5px;border-radius:3px}
.btn.red{background:var(--red);border-color:var(--red)}
#mapview{position:fixed;inset:0;z-index:16;background:#2c6f96}
#mapview canvas{width:100%;height:100%}
#err{position:fixed;inset:0;z-index:30;background:#200;display:flex;align-items:center;justify-content:center;padding:30px;font:700 20px var(--ft);text-align:center}

/* ===== TACTILE ===== */
#touch{position:fixed;inset:0;z-index:5}
#joyBase{position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.06),rgba(255,255,255,.14));border:2px solid rgba(255,255,255,.3);left:calc(46px + var(--sal));bottom:calc(46px + var(--sab));opacity:.55;transition:opacity .2s}
#joyBase.on{opacity:1}
#joyKnob{position:absolute;left:37px;top:37px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.tb{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(10,10,14,.55);border:2px solid rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

  else P.innerHTML = '<h2>À propos</h2><p style="line-height:1.6;opacity:.85">SEDDIK EN FORCE est un jeu en monde ouvert qui se déroule dans une ville inspirée de Tunis : la médina et ses portes bleues, l’avenue et ses cafés, les tours du Lac, les cités, le port et la plage de La Marsa.</p><p style="line-height:1.6;opacity:.6;margin-top:12px">Moteur 3D maison (WebGL2) · musique mezoued générée en direct · aucune installation nécessaire.</p><h2 style="font-size:26px;margin-top:16px">Crédits</h2><p style="line-height:1.6;opacity:.75">Modèles, textures, visages, enseignes, sons et musique : 100 % générés par le code du jeu, aucun asset externe. Polices : Bebas Neue, Anton et Rubik (Google Fonts, licence OFL). Tous les noms, marques, véhicules et armes sont inventés.</p>';
  P.onclick = e => { if (e.target === P) menuPanel(null); };
}
function boot() {
  if (!gl) { $('err').classList.remove('hidden'); $('err').textContent = "Ton appareil ne supporte pas WebGL2 : impossible de lancer SEDDIK EN FORCE."; return; }
  SAVE.load(); G.sens = G.sens || 1; G.resScale = 1; $('perf').classList.toggle('hidden', !G.showPerf); G.stats = Object.assign({ missions: 0, stolen: 0, dist: 0, vmax: 0, busted: 0, time: 0, started: 0 }, G.stats || {});
  if (!G.qName || !QUAL[G.qName]) G.qName = (matchMedia('(pointer:coarse)').matches ? 'moyenne' : 'haute');
  G.q = QUAL[G.qName];
  $('ltip').innerHTML = 'Astuce : ' + pick(TIPS);
  const steps = [['Enseignes et visages', () => { buildAtlas(); initGL(); }], ['Véhicules et habitants', buildMeshes], ['Construction de Tunis', buildWorld], ['Carte de la ville', renderMapCanvas],
    ['Derniers réglages', () => { STARTS = MSTART(); G.player = newPlayer(); G.pickups = []; resize(); }]];
  let k = 0;
  const next = () => {
    if (k >= steps.length) {
      $('lfill').style.width = '100%';
      setTimeout(() => { $('loadWrap').classList.add('hidden'); $('menu').classList.remove('hidden'); }, 350);
      $('mFoot').innerHTML = 'Astuce : ' + pick(TIPS) + '<br><span style="opacity:.6">v4.0 · ' + QUAL[G.qName].name + '</span>';
      $('playBtn').onclick = startGame;
      document.querySelectorAll('.mi[data-p]').forEach(b => b.onclick = () => menuPanel(b.dataset.p));
      $('resumeBtn').onclick = togglePause;
      document.querySelectorAll('.pt').forEach(b => b.onclick = () => pauseTab(b.dataset.t));
      $('fsBtn').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
      requestAnimationFrame(frame); return;
    }
    $('lstep').textContent = steps[k][0]; $('lfill').style.width = (k / steps.length * 100) + '%';
    setTimeout(() => { try { steps[k][1](); k++; next(); } catch (e) { console.error(e); $('err').classList.remove('hidden'); $('err').textContent = 'Erreur : ' + e.message; } }, 40);
  };
  next();
}
setTimeout(boot, 30);

</script>
